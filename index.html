<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>移転しました - 塩入友広</title>
  <!-- このサイトのトップページは https://shioiri.github.io/ へ移転した。
       GitHub Pages ではサーバー側の転送（301）が使えないため、次の3つで移転先へ案内する。
       1. canonical：検索エンジンに、移転先が正式な URL であることを示す
       2. meta refresh（0秒）：ブラウザを移転先へ移動させる。Google はこれを恒久的な転送として扱う
       3. 本文のリンク：自動で移動しない環境のための手動のリンク
       rel="me"：Mastodon のプロフィールに登録した shioiri.jp の本人確認を保つため、移転後も残す -->
  <link rel="canonical" href="https://shioiri.github.io/">
  <meta http-equiv="refresh" content="0; url=https://shioiri.github.io/">
  <meta name="robots" content="noindex">
  <link rel="me" href="https://mas.to/@shioiri">
</head>
<body>
  <p>このサイトは移転しました。<a href="https://shioiri.github.io/">https://shioiri.github.io/</a> をご覧ください。</p>
</body>
</html>
